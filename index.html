<!doctype html>
<html lang="es">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Candi Baila</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: arriba la casa de Candi (se recorre tocando a los lados); debajo el tren de pasos, la biblioteca de pasos y la consola de música. Una sola pantalla, todo con botones grandes. */
:root{
  color-scheme:dark;
  --noche:#22124a; --panel:#33206b; --panel-2:#4a3496; --tiza:#fff6e5; --tenue:#cdc2f2;
  --fucsia:#ff3d8b; --sol:#ffd23f; --mar:#1ec8c8; --verde:#3ddc84; --rojo:#ff5a4d; --madera:#c98b4a;
  --piel:#c28a5c; --pelo:#3a2114; --rizo:#5d3a24; --bota:#7a4dff; --tinta:#1b0e3d;
  --dress:#ff3d8b;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--noche);color:var(--tiza);font-family:var(--f-body);display:flex;flex-direction:column;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--tiza);outline-offset:2px}
.app{flex:1;min-height:0;width:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-rows:minmax(210px,1fr) auto auto auto;gap:10px}
.top{display:grid;grid-template-columns:minmax(0,1fr) clamp(92px,15vw,150px);gap:10px;min-height:0}
.stage{position:relative;border-radius:26px;overflow:hidden;min-height:0;background:radial-gradient(ellipse at 50% 78%,#6a4fd0 0%,#3b2585 46%,#2a1763 100%)}
.stage{touch-action:pan-y;cursor:pointer}
.stage .dancer{position:absolute;inset:0;width:100%;height:100%}
.nudge{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:rgba(27,14,61,.55);display:flex;align-items:center;justify-content:center;pointer-events:none}
.nudge.l{left:8px} .nudge.r{right:8px}
.nudge svg{width:58%;fill:none;stroke:var(--tiza);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.zzz,.notas text{font:800 30px var(--f-display);fill:var(--tiza);animation:zz 1.5s ease-in-out infinite alternate}
.notas text{fill:var(--tinta);animation-duration:.9s}
@keyframes zz{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:translateY(-6px)}}
.count{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.count span{width:26px;height:26px;border-radius:50%;background:var(--panel-2);transition:transform .08s}
.count span.on{background:var(--sol);transform:scale(1.35)}
.memo{min-height:58px;border-radius:22px;background:#b98bff;color:var(--tinta);display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:1rem;box-shadow:0 5px 0 #7a4dff}
.memo:active{transform:translateY(3px);box-shadow:0 2px 0 #7a4dff}
.memo svg{width:26px;height:26px;fill:currentColor}
.mem .swatches,.mem .music,.mem .memo,.dancing .memo{display:none}
.memshow .lib{opacity:.35;pointer-events:none}
.slot.off{visibility:hidden}
.slot .q{font:800 2rem var(--f-display);color:var(--sol)}
.step.hint{animation:pulse .45s infinite alternate;box-shadow:0 0 0 5px var(--tiza)}
.hora{position:absolute;top:10px;right:10px;width:52px;height:52px;border-radius:50%;background:rgba(27,14,61,.6);display:flex;align-items:center;justify-content:center;z-index:3}
.hora svg{width:34px;height:34px}
.yt{position:absolute;top:10px;left:10px;width:200px;height:200px;border-radius:14px;overflow:hidden;background:#000;z-index:2}
.yt iframe{width:100%;height:100%;border:0;display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--panel);border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.sheet h2{margin:0;font:800 1.4rem var(--f-display);color:var(--sol)}
.sheet p{margin:0;color:var(--tenue);max-width:60ch}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet input{flex:1 1 220px;min-width:0;font:inherit;font-size:1rem;padding:12px 14px;border-radius:14px;border:0;background:var(--tiza);color:var(--tinta);-webkit-user-select:text;user-select:text}
.sheet .btn{padding:12px 20px;border-radius:14px;background:var(--panel-2);font-weight:900}
.sheet .btn.ok{background:var(--verde);color:var(--tinta)}
.sheet .tap{flex:1;min-height:80px;border-radius:20px;background:var(--fucsia);font:800 1.3rem var(--f-display)}
.sheet .tap:active{transform:scale(.97)}
.sheet button:disabled{opacity:.4}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.go{flex:1;min-height:90px;border-radius:26px;background:var(--verde);color:var(--tinta);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;box-shadow:0 6px 0 #1f9b56}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1f9b56}
.go svg{width:54%;max-width:74px;height:auto;fill:currentColor}
.dancing .go{background:var(--rojo);box-shadow:0 6px 0 #b8362c}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatches button{aspect-ratio:1;border-radius:50%;background:var(--c);border:4px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--tiza)}
.train{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;background:var(--panel);border-radius:22px;padding:8px}
.slot{aspect-ratio:1;max-height:86px;width:100%;border-radius:16px;background:transparent;border:3px dashed var(--panel-2);display:flex;align-items:center;justify-content:center;transition:transform .1s}
.slot.full{background:var(--c);border:0;animation:pop .25s}
.slot.next{border-color:var(--tenue)}
.slot.now{transform:scale(1.12);box-shadow:0 0 0 4px var(--tiza)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}}
.train.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mini{width:100%;height:100%;display:block}
.lib{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.step{background:var(--c);color:var(--tinta);border-radius:18px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-weight:800;font-size:.82rem;line-height:1.1;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.step:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.step .mini{height:clamp(52px,9vh,84px)}
.music{display:flex;flex-wrap:wrap;gap:8px 14px;background:var(--panel);border-radius:22px;padding:8px}
.grp{display:flex;gap:8px;flex:1 1 auto}
.pad{flex:1;min-width:54px;border-radius:14px;background:var(--panel-2);color:var(--tenue);padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:900;font-size:.72rem;letter-spacing:.01em}
.pad svg{width:26px;height:26px;fill:currentColor}
.pad[aria-pressed="true"]{background:var(--k,var(--sol));color:var(--tinta)}
.pad.beat{animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.18)}}
.dancing .lib,.dancing .music,.dancing .swatches{display:none}
.dancing .app{grid-template-rows:minmax(210px,1fr) auto}
.dancing .slot{pointer-events:none}
.start{position:fixed;inset:0;z-index:20;background:var(--noche);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.start h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,9vw,5rem);line-height:1;margin:0;color:var(--sol)}
.start h1 em{font-style:normal;color:var(--fucsia)}
.start p{margin:0;color:var(--tenue);font-size:1.05rem;max-width:30ch}
.start button{width:min(46vw,210px);aspect-ratio:1;border-radius:50%;background:var(--verde);color:var(--tinta);box-shadow:0 10px 0 #1f9b56;display:flex;align-items:center;justify-content:center}
.start button svg{width:50%;fill:currentColor;margin-left:6%}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.k-piel{fill:var(--piel)} .s-piel{stroke:var(--piel)} .k-dress{fill:var(--dress)} .k-pelo{fill:var(--pelo);stroke:var(--rizo);stroke-width:1.5} .k-bota{fill:var(--bota)} .k-sol{fill:var(--sol)} .k-tiza{fill:var(--tiza)}
@media (max-width:700px){.lib{grid-template-columns:repeat(4,minmax(0,1fr))}.train{gap:5px;padding:6px}.slot{border-radius:11px}}
@media (prefers-reduced-motion:reduce){.pad.beat,.train.shake,.slot.full{animation:none}}
</style>

<div class="start" id="start">
  <h1>Candi <em>Baila</em></h1>
  <button id="startBtn" aria-label="Empezar a jugar"><svg viewBox="0 0 24 24"><path d="M6 3v18l16-9z"/></svg></button>
  <p>Toca el botón verde para prender la música.</p>
</div>

<div class="app" id="app">
  <div class="top">
    <div class="stage" id="stage">
      <svg class="dancer" id="dancer" viewBox="-40 -70 280 390" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Candi en su casa. Toca a un lado para que camine hasta allá"></svg>
      <div class="nudge l" id="nudgeL" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></div>
      <div class="nudge r" id="nudgeR" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></div>
      <div class="yt" id="yt" hidden><div id="ytBox"></div></div>
      <button class="hora" id="hora" aria-label="Cambiar la hora: mañana, tarde o noche"><svg viewBox="0 0 24 24" id="horaIcon" aria-hidden="true"></svg></button>
      <div class="count" id="count" hidden><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="side">
      <button class="go" id="go" aria-label="A bailar"><svg viewBox="0 0 24 24" id="goIcon"><path d="M6 3v18l16-9z"/></svg><span id="goTxt">A bailar</span></button>
      <button class="memo" id="memo" aria-label="Memoria de pasos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2zM9 20h6v2H9z"/></svg><span>Memoria</span></button>
      <div class="swatches" id="swatches" role="group" aria-label="Color del vestido"></div>
    </div>
  </div>
  <div class="train" id="train" role="group" aria-label="Tren de pasos"></div>
  <div class="lib" id="lib" role="group" aria-label="Biblioteca de pasos"></div>
  <div class="music">
    <div class="grp" id="rhythms" role="group" aria-label="Ritmos"></div>
    <div class="grp" id="layers" role="group" aria-label="Instrumentos"></div>
    <div class="grp" id="speeds" role="group" aria-label="Velocidad"></div>
  </div>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Canción de YouTube">
  <h2>Canción de YouTube</h2>
  <p id="ytMsg">Pega el enlace de la canción y toca Cargar.</p>
  <div class="row"><input id="ytUrl" type="url" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off"><button class="btn" id="ytLoad">Cargar</button></div>
  <div class="row"><button class="tap" id="ytTap">Toca aquí al ritmo</button></div>
  <div class="row"><button class="btn" id="ytClose">Cerrar</button><button class="btn ok" id="ytOk">Listo, a bailar</button></div>
</div>
<canvas class="confetti" id="confetti" hidden></canvas>

<script>
(function(){
const $=id=>document.getElementById(id);
const sin=Math.sin,cos=Math.cos,PI=Math.PI,abs=Math.abs,lerp=(a,b,t)=>a+(b-a)*t,cl=(v,a)=>Math.max(-a,Math.min(a,v));
const SQ=30,LA=33,LB=32;

/* ---------- La bailarina ---------- */
function dancerMarkup(){
  let crown='<circle cx="100" cy="66" r="35" class="k-pelo"/>';
  for(let a=-40;a<=220;a+=20){const r=a*PI/180;crown+=`<circle cx="${(100+34*cos(r)).toFixed(1)}" cy="${(62-34*sin(r)).toFixed(1)}" r="12" class="k-pelo"/>`}
  let locks='';[[64,96],[61,112],[69,125],[136,96],[139,112],[131,125]].forEach(p=>locks+=`<circle cx="${p[0]}" cy="${p[1]}" r="11" class="k-pelo"/>`);
  const leg=c=>`<g class="${c}"><line class="d-thigh s-piel" stroke-width="12" stroke-linecap="round"/><line class="d-shin s-piel" stroke-width="11" stroke-linecap="round"/><g class="d-boot"><path class="k-bota" d="M-8 0H8V22H-17Q-19 12 -8 12Z"/><rect class="k-sol" x="-9" y="-3" width="18" height="6" rx="3"/></g></g>`;
  const arm=(c,f)=>`<g class="${c}"><line class="s-piel" x1="0" y1="0" x2="0" y2="30" stroke-width="10" stroke-linecap="round"/><circle r="8.5" class="k-dress"/><g class="${f}"><line class="s-piel" x1="0" y1="0" x2="0" y2="26" stroke-width="9" stroke-linecap="round"/><circle cy="29" r="6.5" class="k-piel"/><circle class="d-food" cy="35" r="6.5" fill="#ff5a4d" visibility="hidden"/></g></g>`;
  return `<ellipse class="d-shadow" cx="100" cy="295" rx="48" ry="7" fill="#000" opacity=".28"/>
<g class="d-body"><g class="d-spin"><g class="d-legs">${leg('d-legL')}${leg('d-legR')}</g>
<g class="d-upper"><g class="d-locks">${locks}</g><g class="d-hair">${crown}</g>
<g class="d-skirt"><path class="k-tiza" opacity=".9" d="M86 150H114L146 216Q123 231 100 224Q77 231 54 216Z"/><path class="k-dress" d="M84 148H116L150 210Q125 226 100 219Q75 226 50 210Z"/><path d="M50 210Q75 226 100 219Q125 226 150 210" stroke="#fff" stroke-opacity=".8" stroke-width="5" fill="none" stroke-linecap="round"/></g>
<g class="d-torso"><rect class="k-piel" x="95" y="84" width="10" height="18"/>
<path class="k-dress" d="M79 98Q100 108 121 98L116 150H84Z"/><path d="M86 99Q100 110 114 99" stroke="#fff" stroke-opacity=".85" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect class="k-sol" x="84" y="143" width="32" height="7" rx="3"/></g>
<g class="d-head"><circle cx="100" cy="68" r="25" class="k-piel"/>
<g class="d-face"><g class="d-eyes"><ellipse cx="91" cy="67" rx="3.2" ry="4.4" fill="#2a1408"/><ellipse cx="109" cy="67" rx="3.2" ry="4.4" fill="#2a1408"/><circle cx="92" cy="65.5" r="1.2" fill="#fff"/><circle cx="110" cy="65.5" r="1.2" fill="#fff"/><path d="M87 62.5l-2.5-2M113 62.5l2.5-2" stroke="#2a1408" stroke-width="1.4" stroke-linecap="round"/></g>
<path class="d-smile" d="M90 77Q100 87 110 77" stroke="#2a1408" stroke-width="2.6" fill="none" stroke-linecap="round"/><path class="d-open" visibility="hidden" d="M89 76Q100 93 111 76Z" fill="#8a2233" stroke="#2a1408" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="83" cy="76" r="4.5" fill="#ff7a8a" opacity=".5"/><circle cx="117" cy="76" r="4.5" fill="#ff7a8a" opacity=".5"/></g>
<circle cx="83" cy="46" r="9" class="k-pelo"/><circle cx="95" cy="41" r="9" class="k-pelo"/><circle cx="107" cy="41" r="9" class="k-pelo"/><circle cx="118" cy="46" r="9" class="k-pelo"/>
<circle class="d-back k-pelo" cx="100" cy="68" r="27" visibility="hidden"/></g>
${arm('d-armL','d-foreL')}${arm('d-armR','d-foreR')}</g></g></g>`;
}
function rig(svg){const q=s=>svg.querySelector(s);return{shadow:q('.d-shadow'),body:q('.d-body'),spin:q('.d-spin'),
  thL:q('.d-legL .d-thigh'),shL:q('.d-legL .d-shin'),btL:q('.d-legL .d-boot'),thR:q('.d-legR .d-thigh'),shR:q('.d-legR .d-shin'),btR:q('.d-legR .d-boot'),
  upper:q('.d-upper'),hair:q('.d-hair'),locks:q('.d-locks'),skirt:q('.d-skirt'),head:q('.d-head'),face:q('.d-face'),eyes:q('.d-eyes'),smile:q('.d-smile'),open:q('.d-open'),back:q('.d-back'),
  armL:q('.d-armL'),armR:q('.d-armR'),foreL:q('.d-foreL'),foreR:q('.d-foreR'),legs:q('.d-legs'),torso:q('.d-torso'),food:q('.d-foreR .d-food')}}
const BASE={rot:0,py:82,tuck:0,sleep:0,eat:0,x:0,y:0,squat:0,lean:0,spin:0,aL:15,eL:-8,aR:15,eR:-8,legL:0,legR:0,spread:0,skew:0,flare:0,head:0,joy:0};
const T=(e,v)=>e.setAttribute('transform',v), f1=n=>n.toFixed(1);
const seg=(e,x1,y1,x2,y2)=>{e.setAttribute('x1',f1(x1));e.setAttribute('y1',f1(y1));e.setAttribute('x2',f1(x2));e.setAttribute('y2',f1(y2))};
function solveLeg(th,sh,bt,side,lift,o){
  const hx=100+12*side,hy=205,fx=hx+side*(lift*8+o.spread*.7),fy=hy+65-o.squat*SQ-lift*27;
  const dx=fx-hx,dy=fy-hy,d=Math.min(Math.hypot(dx,dy),LA+LB-.01),phi=Math.atan2(dx,dy);
  const al=Math.acos(cl((LA*LA+d*d-LB*LB)/(2*LA*d),1)),t=phi+side*al,kx=hx+LA*sin(t),ky=hy+LA*cos(t);
  seg(th,hx,hy,kx,ky);seg(sh,kx,ky,fx,fy);
  const psi=Math.atan2(fx-kx,fy-ky)*180/PI;
  T(bt,`translate(${f1(fx)} ${f1(fy)}) rotate(${f1(-psi*.6)}) scale(${-side} 1)`);
}
function applyPose(P,o,s){
  s=s||{hair:-o.lean*.5,lockY:0,skew:o.skew,flare:o.flare,sy:1,spread:0,eye:1};
  const tk=o.tuck>.5,et=o.eat>.5;
  T(P.body,`translate(${f1(o.x)} ${f1(o.y+o.squat*SQ)})`+(abs(o.rot)>.05?` rotate(${f1(o.rot)} 100 ${f1(o.py)})`:''));
  P.shadow.setAttribute('cx',f1(100+o.x));P.shadow.setAttribute('rx',tk?'0':f1(48*(1+o.y/150)));
  if(P.tk!==tk){P.tk=tk;[P.legs,P.torso,P.skirt,P.armL,P.armR].forEach(e=>e.setAttribute('visibility',tk?'hidden':'visible'))}
  if(P.et!==et){P.et=et;P.food.setAttribute('visibility',et?'visible':'hidden')}
  let c=cos(2*PI*o.spin); if(abs(c)<.06)c=c<0?-.06:.06;
  T(P.spin,`translate(100 0) scale(${c.toFixed(3)} 1) translate(-100 0)`);
  const back=c<0; P.back.setAttribute('visibility',back?'visible':'hidden'); P.face.setAttribute('visibility',back?'hidden':'visible');
  solveLeg(P.thL,P.shL,P.btL,-1,o.legL,o); solveLeg(P.thR,P.shR,P.btR,1,o.legR,o);
  T(P.upper,`translate(100 205) rotate(${f1(o.lean)}) scale(${(2-s.sy).toFixed(3)} ${s.sy.toFixed(3)}) translate(-100 -205)`);
  const f=Math.max(0,Math.min(1.3,s.flare));
  T(P.skirt,`translate(100 150) skewX(${f1(s.skew)}) scale(${(1+.35*f).toFixed(3)} ${(1-.08*f).toFixed(3)}) translate(-100 -150)`);
  T(P.head,`rotate(${f1(o.head)} 100 92)`);
  T(P.hair,`rotate(${f1(s.hair*.45)} 100 62) translate(0 ${f1(s.lockY*.35)})`);
  T(P.locks,`translate(100 62) rotate(${f1(s.hair)}) scale(${(1+s.spread).toFixed(3)} 1) translate(-100 -62) translate(0 ${f1(s.lockY)})`);
  T(P.eyes,`translate(0 67) scale(1 ${s.eye}) translate(0 -67)`);
  const joy=o.joy>.5&&!back; P.open.setAttribute('visibility',joy?'visible':'hidden'); P.smile.setAttribute('visibility',joy||back?'hidden':'visible');
  T(P.armL,`translate(80 102) rotate(${f1(o.aL)})`); T(P.foreL,`translate(0 30) rotate(${f1(o.eL)})`);
  T(P.armR,`translate(120 102) rotate(${f1(-o.aR)})`); T(P.foreR,`translate(0 30) rotate(${f1(-o.eR)})`);
}

/* ---------- La casa: un mundo largo (jardín, sala, cocina, cuarto, patio) que se desliza detrás de la bailarina ---------- */
const FY=268,MINX=60,MAXX=2040,WALK=240;
const ROOMS=[{n:'El jardín',b:420},{n:'La sala',b:840},{n:'La cocina',b:1260},{n:'El cuarto',b:1680},{n:'El patio',b:1e9}];
const roomAt=x=>ROOMS.findIndex(r=>x<r.b);
function houseMarkup(){

        setTimeout(()=>{party=null;if(mem!==m)return;mem.seq=memNew(mem.seq.length<8?mem.seq:null);memShow()},4200)},700)}}
  else{mem.miss++;blip('full');trainEl.classList.remove('shake');void trainEl.offsetWidth;trainEl.classList.add('shake');
    if(mem.miss>=2){clearHint();$('step'+want).classList.add('hint');speak(STEPS[want].name);preview={id:want,t0:ctx.currentTime,dur:stepDur()*16}}}
}
$('memo').onclick=startMem;

/* ---------- La hora del día: mañana, tarde, noche ---------- */
const HORAS=[
 {n:'La mañana',c:['#3d8fe0','#8fd3ff','#d8f4ff'],pane:'#bfe8ff',sol:0,noche:0,icon:'<circle cx="12" cy="12" r="5.5" fill="#ffd23f"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="#ffd23f" stroke-width="2.2" stroke-linecap="round"/>'},
 {n:'La tarde',c:['#5a3a9c','#ff8a6b','#ffd23f'],pane:'#ffb27a',sol:150,noche:0,icon:'<path d="M5 17a7 7 0 0 1 14 0z" fill="#ff8a3d"/><path d="M2 20h20M12 4v3M4.9 8.9l2 2M19.1 8.9l-2 2" stroke="#ff8a3d" stroke-width="2.2" stroke-linecap="round"/>'},
 {n:'La noche',c:['#1b1147','#3b2585','#6a3a9c'],pane:'#2a1763',noche:1,icon:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="#fff3c4"/><circle cx="18" cy="5" r="1.3" fill="#fff6e5"/><circle cx="21" cy="9" r="1" fill="#fff6e5"/>'}];
function paintHora(){const h=HORAS[S.hora|0],v=b=>b?'visible':'hidden';
  $('cielo0').setAttribute('fill',h.c[0]);['cieloA','cieloB','cieloC'].forEach((id,i)=>$(id).setAttribute('stop-color',h.c[i]));
  $('estrellas').setAttribute('visibility',v(h.noche));$('luna').setAttribute('visibility',v(h.noche));$('sol').setAttribute('visibility',v(!h.noche));T($('sol'),`translate(0 ${h.sol||0})`);
  document.querySelectorAll('#world .pane').forEach(e=>e.setAttribute('fill',h.pane));document.querySelectorAll('#world .vnoche').forEach(e=>e.setAttribute('visibility',v(h.noche)));
  $('horaIcon').innerHTML=h.icon}
$('hora').addEventListener('pointerdown',e=>e.stopPropagation());
$('hora').onclick=()=>{S.hora=((S.hora|0)+1)%3;save();paintHora();speak(HORAS[S.hora].n);blip()};
paintHora();
function countIn(pos){const n=Math.floor((pos+16)/4),c=$('count');c.hidden=false;[].forEach.call(c.children,(e,i)=>e.classList.toggle('on',i<=n))}

/* ---------- YouTube: un adulto pega el enlace y marca el ritmo; Candi baila encima de la canción ---------- */
const ytOK=/^https?:$/.test(location.protocol)&&!/claude/i.test(location.hostname);
let taps=[];
const ytMsg=t=>{$('ytMsg').textContent=t};
function ytId(u){u=String(u).trim();const m=u.match(/(?:[?&]v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/);return m?m[1]:null}
function ytApi(cb){if(window.YT&&YT.Player)return cb();window.onYouTubeIframeAPIReady=cb;
  if(!$('ytApi')){const s=document.createElement('script');s.id='ytApi';s.src='https://www.youtube.com/iframe_api';s.onerror=()=>ytMsg('No pude conectar con YouTube. Revisa el internet.');document.head.appendChild(s)}}
function openYt(){
  if(dancing||mem)return;$('sheet').hidden=false;
  if(!ytOK){ytMsg('La canción de YouTube no funciona dentro de este enlace de Claude. Funciona en la versión de la casa, abierta desde su propia dirección.');['ytUrl','ytLoad','ytTap','ytOk'].forEach(id=>$(id).disabled=true);return}
  if(S.yt&&S.yt.id&&!$('ytUrl').value)$('ytUrl').value='https://youtu.be/'+S.yt.id;
  ytMsg(yp?'Toca el botón rosado al ritmo de la canción, 8 veces, y luego Listo.':'Pega el enlace de la canción y toca Cargar.');
}
$('ytClose').onclick=()=>{$('sheet').hidden=true};
$('ytLoad').onclick=()=>{
  const id=ytId($('ytUrl').value);if(!id){ytMsg('Ese enlace no parece de YouTube. Cópialo del botón Compartir del video.');return}
  if(!S.yt||S.yt.id!==id)S.yt={id,bpm:0,off:0};save();if(playing&&src==='synth')stopMusic();$('yt').hidden=false;taps=[];
  ytApi(()=>{if(yp&&ytReady){yp.loadVideoById(id);return}
    yp=new YT.Player('ytBox',{videoId:id,playerVars:{playsinline:1,rel:0,modestbranding:1},events:{
      onReady:()=>{ytReady=true;yp.playVideo()},
      onError:e=>ytMsg(e.data===101||e.data===150?'El dueño de ese video no deja ponerlo en otros juegos. Prueba con otro video de la misma canción.':'No pude cargar ese video.'),
      onStateChange:e=>{if(e.data===0&&dancing)endDance(true)}}})});
  ytMsg(S.yt.bpm?'Ya sé el ritmo de esta canción. Toca Listo, o marca el ritmo otra vez.':'Cuando suene la canción, toca el botón rosado al ritmo, 8 veces.');
};
$('ytTap').onclick=()=>{
  if(!yp||!ytReady||!S.yt)return;const t=ytTime();taps.push(t);if(taps.length>9)taps.shift();
  if(taps.length<4){ytMsg('Sigue… '+taps.length+' de 8');return}
  const iv=[];for(let i=1;i<taps.length;i++)iv.push(taps[i]-taps[i-1]);iv.sort((a,b)=>a-b);const mid=iv[iv.length>>1];
  if(!(mid>.2)){ytMsg('La canción tiene que estar sonando mientras tocas.');taps=[];return}
  let b=60/mid;while(b<70)b*=2;while(b>170)b/=2;S.yt.bpm=b;S.yt.off=t;save();
  ytMsg(taps.length<8?'Sigue… '+taps.length+' de 8':'¡Listo! Ritmo '+Math.round(b)+'. Toca "Listo, a bailar".');
};
$('ytOk').onclick=()=>{if(!S.yt||!S.yt.bpm||!ytReady){ytMsg('Primero carga la canción y toca el botón rosado al ritmo, 8 veces.');return}
  src='yt';$('sheet').hidden=true;$('yt').hidden=false;startMusic(0)};

/* Movimiento secundario: pelo, falda y cuerpo siguen con resortes al movimiento principal */
const sec={hair:{p:0,v:0},lockY:{p:0,v:0},skew:{p:0,v:0},flare:{p:0,v:0},sy:{p:1,v:0},spread:{p:0,v:0}};
const spr=(s,target,h,k,c)=>{s.v+=(k*(target-s.p)-c*s.v)*h;s.p+=s.v*h};
let pbx=0,pby=0,psp=0,nextBlink=2,blinkEnd=0;
function frame(ts){
  const dt=Math.max(.004,Math.min(.05,(ts-lastTs)/1000||.016));lastTs=ts;
  const now=ctx?ctx.currentTime:ts/1000;let tg=null,beat=-1;
  if(party)tg=partyPose(now-party.t0);
  else if(mem&&mem.phase==='show'){
    const pos=position(now);beat=((pos/4)%1+1)%1;
    if(pos<0){tg=idle((pos+16)/16);countIn(pos)}
    else{$('count').hidden=true;const bar=Math.floor(pos/16);
      if(bar>=mem.seq.length){memPlay();tg=idle(0)}
      else{if(bar!==mem.shown){mem.shown=bar;fillSlot($('slot'+bar),mem.seq[bar])}markSlot(bar);tg=STEPS[mem.seq[bar]].f((pos/16)%1)}}
  }
  else if(dancing){
    const pos=position(now);beat=((pos/4)%1+1)%1;
    if(pos<0){tg=idle((pos+16)/16);countIn(pos)}
    else{$('count').hidden=true;const bar=Math.floor(pos/16);
      if(bar>=32){endDance(true);tg=partyPose(0)}
      else{const w=bar%loopLen,id=S.train[w],p=(pos/16)%1;markSlot(w);tg=id!=null?STEPS[id].f(p):idle(p)}}
  }else if(act){if(act==='radio'&&!playing)stopAct();else tg=actPose(act,now)}
  else if(preview){const p=(now-preview.t0)/preview.dur;if(p>=1)preview=null;else tg=STEPS[preview.id].f(p)}
  if(!tg){if(playing){const pos=position(now);beat=((pos/4)%1+1)%1;tg=idle(((pos/16)%1+1)%1)}else tg=pose({squat:.04+.04*sin(now*1.6),aL:16,aR:16,head:2*sin(now*.9)})}
  if(held)aim(heldX);
  const dd=tx-wx;let walking=false;
  if(!party&&abs(dd)>1.5){const dir=dd>0?1:-1;wx+=dir*Math.min(abs(dd),WALK*dt);walking=true;tg=walkPose(wx/150,dir);
    const ft=Math.floor(wx/75);if(ft!==foot){foot=ft;pasito()}}
  if(walking!==wasWalking){wasWalking=walking;MARK.setAttribute('visibility',walking?'visible':'hidden');if(!walking){S.wx=Math.round(wx);save();paintNudge();if(goal){const g=goal;goal=null;startAct(g)}}}
  if(walking)T(MARK,`translate(${f1(tx)} 0)`);
  const rm=roomAt(wx);if(rm!==room){room=rm;speak(ROOMS[rm].n);blip()}
  cam+=(wx-cam)*(1-Math.exp(-dt*6));const wt=`translate(${f1(100-cam)} 0)`;T(WORLD,wt);T(FRONT,wt);
  const k=1-Math.exp(-dt*22);
  for(const key in tg){cur[key]=(key==='y'||key==='spin')?tg[key]:cur[key]+(tg[key]-cur[key])*k}
  swA=act==='columpio'?cur.rot:swA*.85;T(SWING,`rotate(${swA.toFixed(2)} 1911 82)`);
  const bite=act==='mesa'&&cur.joy>.5;if(bite&&!ate)nam();ate=bite;
  const off=wx-cam,bx=cur.x+off,by=cur.y+cur.squat*SQ,vx=(bx-pbx)/dt,vy=(by-pby)/dt,ds=cur.spin-psp,vs=abs(ds)>.5?0:cl(ds/dt,2);pbx=bx;pby=by;psp=cur.spin;
  for(let i=0;i<2;i++){const h=dt/2;
    spr(sec.hair,cl(vx*.1,16)-cur.lean*.6,h,150,11);
    spr(sec.lockY,cl(-vy*.035,8),h,170,12);
    spr(sec.skew,cur.skew+cl(-vx*.1,14),h,200,16);
    spr(sec.flare,cur.flare+Math.max(0,cl(vy*.0022,.3))+Math.min(.3,abs(vs)*.25),h,160,14);
    spr(sec.sy,1+cl(-vy/1600,.06),h,260,18);
    spr(sec.spread,Math.min(.4,abs(vs)*.45),h,120,12)}
  const w=ts/1000; if(w>nextBlink){blinkEnd=w+.13;nextBlink=w+2.4+Math.random()*3}
  applyPose(MAIN,off?Object.assign({},cur,{x:bx}):cur,{hair:sec.hair.p+cl(-cur.rot*.5,18),lockY:sec.lockY.p,skew:sec.skew.p,flare:sec.flare.p,sy:sec.sy.p,spread:sec.spread.p,eye:(w<blinkEnd||cur.sleep>.5)?.12:1});
  $('glow').style.opacity=(party?.5:beat<0?.1:.1+.4*Math.exp(-beat*4)).toFixed(3);
  requestAnimationFrame(frame);
}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=$('confetti'),g=cv.getContext('2d');cv.hidden=false;const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cs=['#ff3d8b','#ffd23f','#1ec8c8','#ff8a3d','#86de5a','#b98bff'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,r:Math.random()*6,c:cs[Math.floor(Math.random()*cs.length)]}));
  const t0=performance.now();
  (function draw(t){g.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.15;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});
    if(t-t0<4000)requestAnimationFrame(draw);else{g.clearRect(0,0,W,H);cv.hidden=true}})(t0);
}

paintTrain();paintDress();paintMusic();paintNudge();applyPose(MAIN,cur);requestAnimationFrame(frame);
$('startBtn').onclick=()=>{initAudio();if(ctx&&ctx.resume)ctx.resume();$('start').hidden=true;startMusic(0)};
})();
</script>
